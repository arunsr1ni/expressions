<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#e8d5b5"/>

  <g fill="none" stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">

    <!-- Sunrise arc and rays behind the open figure -->
    <path d="M340 280 Q400 120 460 280" stroke-width="1.8"/>
    <line x1="360" y1="250" x2="340" y2="180" stroke-width="1"/>
    <line x1="380" y1="230" x2="365" y2="155" stroke-width="1"/>
    <line x1="400" y1="220" x2="400" y2="135" stroke-width="1"/>
    <line x1="420" y1="230" x2="435" y2="155" stroke-width="1"/>
    <line x1="440" y1="250" x2="460" y2="180" stroke-width="1"/>

    <!-- Rain lines falling gently on the left side -->
    <line x1="285" y1="160" x2="280" y2="190" stroke-width="0.8"/>
    <line x1="310" y1="140" x2="305" y2="170" stroke-width="0.8"/>
    <line x1="260" y1="200" x2="255" y2="230" stroke-width="0.8"/>
    <line x1="490" y1="155" x2="485" y2="185" stroke-width="0.8"/>
    <line x1="510" y1="180" x2="505" y2="210" stroke-width="0.8"/>
    <line x1="300" y1="250" x2="295" y2="280" stroke-width="0.8"/>
    <line x1="500" y1="230" x2="495" y2="260" stroke-width="0.8"/>
    <line x1="270" y1="310" x2="265" y2="340" stroke-width="0.8"/>
    <line x1="520" y1="290" x2="515" y2="320" stroke-width="0.8"/>
    <line x1="245" y1="360" x2="240" y2="390" stroke-width="0.8"/>

    <!-- THE OPEN FIGURE (left) - seated, head up, arms open, masculine build -->

    <!-- Head -->
    <circle cx="400" cy="300" r="22" stroke-width="1.8"/>
    <!-- Face - closed eyes looking up, calm expression -->
    <path d="M391 295 Q394 293 397 295" stroke-width="1"/>
    <path d="M403 295 Q406 293 409 295" stroke-width="1"/>
    <path d="M395 306 Q400 309 405 306" stroke-width="1"/>

    <!-- Neck - slightly thicker -->
    <line x1="395" y1="322" x2="394" y2="340" stroke-width="1.5"/>
    <line x1="405" y1="322" x2="406" y2="340" stroke-width="1.5"/>

    <!-- Shoulders - broader -->
    <path d="M394 340 Q390 344 362 348" stroke-width="1.5"/>
    <path d="M406 340 Q410 344 438 348" stroke-width="1.5"/>

    <!-- Torso - wider, straighter, masculine -->
    <line x1="372" y1="348" x2="378" y2="415" stroke-width="1.5"/>
    <line x1="428" y1="348" x2="422" y2="415" stroke-width="1.5"/>

    <!-- Shorts - straight hem across, then short legs visible -->
    <line x1="378" y1="415" x2="375" y2="440" stroke-width="1.5"/>
    <line x1="422" y1="415" x2="425" y2="440" stroke-width="1.5"/>
    <!-- Shorts hem -->
    <line x1="375" y1="440" x2="398" y2="441" stroke-width="1.3"/>
    <line x1="402" y1="441" x2="425" y2="440" stroke-width="1.3"/>
    <!-- Center seam hint -->
    <line x1="400" y1="415" x2="400" y2="441" stroke-width="0.8"/>

    <!-- Left arm - extended open, palm up -->
    <path d="M362 348 Q335 358 300 340 Q280 332 265 340" stroke-width="1.5"/>
    <!-- Left hand - open, receiving -->
    <path d="M265 340 Q258 335 255 330" stroke-width="1"/>
    <path d="M265 340 Q257 338 252 336" stroke-width="1"/>
    <path d="M265 340 Q258 342 254 343" stroke-width="1"/>
    <path d="M265 340 Q260 346 258 350" stroke-width="1"/>

    <!-- Right arm - extended open, palm up -->
    <path d="M438 348 Q465 358 500 340 Q520 332 535 340" stroke-width="1.5"/>
    <!-- Right hand - open, receiving -->
    <path d="M535 340 Q542 335 545 330" stroke-width="1"/>
    <path d="M535 340 Q543 338 548 336" stroke-width="1"/>
    <path d="M535 340 Q542 342 546 343" stroke-width="1"/>
    <path d="M535 340 Q540 346 542 350" stroke-width="1"/>

    <!-- Legs - cross-legged sitting, emerging from shorts -->
    <path d="M380 441 Q370 452 345 460 Q320 468 310 463" stroke-width="1.5"/>
    <path d="M420 441 Q430 452 455 460 Q480 468 490 463" stroke-width="1.5"/>
    <!-- Crossed portion -->
    <path d="M310 463 Q330 473 370 473" stroke-width="1.3"/>
    <path d="M490 463 Q470 473 430 473" stroke-width="1.3"/>

    <!-- Ground line under open figure - organic -->
    <path d="M220 488 Q320 483 400 488 Q480 493 580 486" stroke-width="0.8" stroke-dasharray="4,4"/>

    <!-- BUTTERFLY near left hand -->
    <g transform="translate(235, 295)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke-width="1.2"/>
      <path d="M0 -8 Q-5 -14 -7 -18" stroke-width="0.8"/>
      <path d="M0 -8 Q5 -14 7 -18" stroke-width="0.8"/>
      <path d="M0 -4 Q-16 -18 -20 -6 Q-18 4 0 0" stroke-width="1"/>
      <path d="M0 -4 Q16 -18 20 -6 Q18 4 0 0" stroke-width="1"/>
      <path d="M0 0 Q-14 6 -16 14 Q-10 16 0 6" stroke-width="1"/>
      <path d="M0 0 Q14 6 16 14 Q10 16 0 6" stroke-width="1"/>
    </g>

    <!-- COCKROACH near right hand - same scale, wings lifted -->
    <g transform="translate(565, 298)">
      <ellipse cx="0" cy="0" rx="8" ry="12" stroke-width="1.2"/>
      <circle cx="0" cy="-15" r="4" stroke-width="1"/>
      <path d="M-2 -19 Q-8 -28 -12 -32" stroke-width="0.8"/>
      <path d="M2 -19 Q8 -28 12 -32" stroke-width="0.8"/>
      <path d="M-4 -6 Q-24 -20 -28 -8 Q-26 4 -6 4" stroke-width="1"/>
      <path d="M4 -6 Q24 -20 28 -8 Q26 4 6 4" stroke-width="1"/>
      <path d="M-6 -4 L-16 -8" stroke-width="0.7"/>
      <path d="M-7 2 L-18 0" stroke-width="0.7"/>
      <path d="M-6 8 L-16 12" stroke-width="0.7"/>
      <path d="M6 -4 L16 -8" stroke-width="0.7"/>
      <path d="M7 2 L18 0" stroke-width="0.7"/>
      <path d="M6 8 L16 12" stroke-width="0.7"/>
    </g>

    <!-- DEER AND LION scene -->
    <!-- Lion -->
    <g transform="translate(200, 550)">
      <path d="M0 0 Q10 -15 30 -12 Q50 -10 55 0 Q58 8 50 12 L10 12 Q0 10 0 0Z" stroke-width="1.2"/>
      <path d="M5 -5 Q-2 -15 5 -20 Q12 -25 18 -18 Q24 -25 30 -20 Q36 -14 30 -8" stroke-width="1"/>
      <circle cx="12" cy="-12" r="8" stroke-width="1.2"/>
      <circle cx="9" cy="-13" r="1.2" fill="#1a1a1a" stroke="none"/>
      <line x1="12" y1="12" x2="10" y2="28" stroke-width="1"/>
      <line x1="20" y1="12" x2="18" y2="28" stroke-width="1"/>
      <line x1="40" y1="12" x2="38" y2="28" stroke-width="1"/>
      <line x1="48" y1="12" x2="46" y2="28" stroke-width="1"/>
      <path d="M55 5 Q65 -5 68 5" stroke-width="0.8"/>
    </g>

    <!-- Deer -->
    <g transform="translate(290, 530)">
      <path d="M0 10 Q5 -5 25 -8 Q45 -10 55 -2 Q60 5 55 12 L5 15 Q-2 14 0 10Z" stroke-width="1.2"/>
      <path d="M8 -2 Q5 -20 12 -35" stroke-width="1.2"/>
      <ellipse cx="14" cy="-40" rx="6" ry="8" stroke-width="1.2"/>
      <circle cx="11" cy="-41" r="1.2" fill="#1a1a1a" stroke="none"/>
      <path d="M14 -48 Q12 -58 8 -62" stroke-width="0.8"/>
      <path d="M14 -48 Q10 -55 6 -56" stroke-width="0.8"/>
      <path d="M16 -48 Q18 -58 22 -62" stroke-width="0.8"/>
      <path d="M16 -48 Q20 -55 24 -56" stroke-width="0.8"/>
      <line x1="12" y1="15" x2="10" y2="35" stroke-width="0.9"/>
      <line x1="22" y1="15" x2="20" y2="35" stroke-width="0.9"/>
      <line x1="42" y1="13" x2="40" y2="35" stroke-width="0.9"/>
      <line x1="50" y1="12" x2="48" y2="35" stroke-width="0.9"/>
      <path d="M55 5 Q60 2 62 6" stroke-width="0.7"/>
    </g>

    <!-- FLOWING LINE - the divide -->
    <path d="M600 100 Q620 200 640 300 Q650 380 630 450 Q620 520 640 600"
          stroke-width="1.2" stroke-dasharray="6,4"/>

    <!-- THE CLOSED FIGURE (right) - hunched, kneeling, behind a door -->

    <!-- Door frame -->
    <rect x="800" y="180" width="140" height="340" rx="3" stroke-width="1.8"/>
    <rect x="815" y="200" width="110" height="130" rx="2" stroke-width="0.8"/>
    <rect x="815" y="345" width="110" height="155" rx="2" stroke-width="0.8"/>
    <circle cx="910" cy="360" r="5" stroke-width="1.2"/>

    <!-- Kneeling figure - head bowed -->
    <circle cx="760" cy="385" r="18" stroke-width="1.8"/>

    <!-- Hair suggestion -->
    <path d="M745 375 Q750 365 760 362 Q770 365 775 375" stroke-width="1"/>

    <!-- Face - eyes downcast -->
    <path d="M753 383 L757 384" stroke-width="1"/>
    <path d="M763 383 L767 384" stroke-width="1"/>
    <line x1="755" y1="393" x2="765" y2="393" stroke-width="0.8"/>

    <!-- Neck bowed -->
    <path d="M760 403 Q762 412 768 418" stroke-width="1.5"/>

    <!-- Shoulders - hunched -->
    <path d="M768 418 Q780 415 795 425" stroke-width="1.5"/>
    <path d="M768 418 Q755 420 740 430" stroke-width="1.5"/>

    <!-- Back -->
    <path d="M795 425 L798 480" stroke-width="1.5"/>
    <path d="M740 430 L742 480" stroke-width="1.5"/>

    <!-- Arms wrapped around self -->
    <path d="M740 430 Q725 445 720 460 Q718 470 730 475 Q745 478 760 470" stroke-width="1.3"/>
    <path d="M795 425 Q808 445 812 460 Q814 470 802 475 Q788 478 775 470" stroke-width="1.3"/>

    <!-- Legs - kneeling -->
    <path d="M742 480 Q740 500 730 515 Q725 525 735 530" stroke-width="1.3"/>
    <path d="M798 480 Q800 500 810 515 Q815 525 805 530" stroke-width="1.3"/>
    <path d="M735 530 Q745 535 755 530" stroke-width="1"/>
    <path d="M805 530 Q795 535 785 530" stroke-width="1"/>

    <!-- Shadows around closed figure -->
    <path d="M700 200 Q710 250 705 300" stroke-width="0.6" opacity="0.4"/>
    <path d="M695 230 Q700 280 698 330" stroke-width="0.6" opacity="0.35"/>
    <path d="M690 260 Q698 310 693 360" stroke-width="0.6" opacity="0.3"/>
    <path d="M950 220 Q945 280 950 340" stroke-width="0.6" opacity="0.4"/>
    <path d="M958 250 Q952 310 957 370" stroke-width="0.6" opacity="0.35"/>
    <path d="M965 280 Q958 340 963 400" stroke-width="0.6" opacity="0.3"/>

    <!-- GRIEF companion -->
    <g transform="translate(470, 433)">
      <circle cx="0" cy="0" r="10" stroke-width="1"/>
      <line x1="0" y1="10" x2="0" y2="28" stroke-width="1"/>
      <path d="M0 15 Q-10 20 -14 25" stroke-width="0.8"/>
      <path d="M0 15 Q10 20 14 25" stroke-width="0.8"/>
      <path d="M-3 28 L-6 42" stroke-width="0.8"/>
      <path d="M3 28 L6 42" stroke-width="0.8"/>
    </g>

    <!-- Ground details -->
    <path d="M180 590 Q220 585 260 590 Q300 595 340 588" stroke-width="0.6" opacity="0.5"/>
    <path d="M160 610 Q250 603 340 610 Q430 617 520 608" stroke-width="0.6" opacity="0.4"/>
    <path d="M700 555 Q750 548 800 553 Q850 558 900 550" stroke-width="0.6" opacity="0.4"/>

    <!-- Memory wisps -->
    <path d="M390 275 Q385 255 390 235 Q395 220 388 200" stroke-width="0.7" opacity="0.5"/>
    <path d="M410 275 Q415 250 408 230 Q405 215 412 195" stroke-width="0.7" opacity="0.5"/>
    <path d="M400 270 Q400 245 398 225 Q396 210 400 190" stroke-width="0.7" opacity="0.45"/>

  </g>
</svg>
